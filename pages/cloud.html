<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy/Cloud Games - Athyx Network</title>
  <link rel="stylesheet" href="../themes.css">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text-main, #fff5f6);
      font-family: 'Outfit', system-ui, sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 24px 96px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 26px;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface, rgba(20, 20, 28, 0.78));
      border: 1px solid var(--border, rgba(255, 255, 255, 0.1));
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent, #ff4d6d);
    }

    .card img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      padding: 10px;
      filter: invert(1);
    }

    .card-name {
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    .card-tag {
      font-size: 11px;
      opacity: 0.7;
    }
  </style>
  <script src="../js/themes.js"></script>
  <script src="../js/cdn-config.js?v=1"></script>
</head>

<body>
  <div class="container">
    <h1>Proxy / Cloud Games</h1>
    <div class="grid" id="cloudGrid">Loading...</div>
  </div>
  <script>
    const CDN_BASE = "https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-cloud-games@main/";
    async function loadCloudGames() {
      const grid = document.getElementById("cloudGrid");
      try {
        const res = await fetch(CDN_BASE + "games.json?v=" + Date.now(), { cache: "no-cache" });
        if (!res.ok) throw new Error("Could not load cloud games");
        const games = await res.json();
        grid.innerHTML = "";
        games.forEach(g => {
          const card = document.createElement("div");
          card.className = "card";
          card.onclick = () => {
            window.open(g.url, "_blank");
          };
          const iconSrc = g.icon.startsWith("http") ? g.icon : CDN_BASE + g.icon;
          card.innerHTML = `<img src="${iconSrc}" alt="${g.name}"><div class="card-name">${g.name}</div><div class="card-tag">${g.tag || "Cloud"}</div>`;
          grid.appendChild(card);
        });
      } catch (e) {
        grid.textContent = "Failed to load cloud games.";
      }
    }
    loadCloudGames();
  </script>
  <script src="../js/particle.js"></script>
</body>

</html>
