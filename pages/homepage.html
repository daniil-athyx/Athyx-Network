<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athyx Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../themes.css">
  <script src="../js/themes.js?v=2"></script>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="shortcut icon" href="../assets/favicon.ico">

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0508;
      --surface: rgba(28, 12, 16, 0.82);
      --surface-hover: rgba(42, 18, 24, 0.9);
      --surface-active: rgba(64, 26, 35, 0.96);
      --border: rgba(10, 255, 206, 0.16);
      --border-hover: rgba(10, 255, 206, 0.32);
      --text: #fff5f6;
      --text-muted: #f7c6ce;
      --text-dim: rgb(10, 255, 206);
      --accent: rgb(10, 255, 206);
      --accent-dim: rgba(10, 255, 206, 0.18);
      --accent-glow: rgba(10, 255, 206, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(rgba(255, 255, 255, 0.075) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 100px;
      position: relative;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    
    .dork-box {
      position: fixed;
      top: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: 
        0 10px 30px -8px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.02);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 280px;
      text-align: center;
      z-index: 50;
    }

    .dork-box:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 
        0 14px 36px -8px rgba(0, 0, 0, 0.7),
        0 0 20px -4px var(--accent-glow);
    }

    .dork-box img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .dork-box-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .dork-box-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .dork-box-sub {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .dork-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid rgba(10, 255, 206, 0.3);
    }

    .dork-btn {
      background: var(--accent);
      color: var(--accent-text, #fff);
      border: none;
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 4px;
    }

    .dork-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2.4rem, 5vw, 3.4rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
      background: linear-gradient(180deg, #ffffff 30%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    
    .search-container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto 18px auto;
      position: relative;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 6px 10px 6px 18px;
      box-shadow: 
        0 12px 30px -10px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.02);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 
        0 16px 36px -10px rgba(0, 0, 0, 0.8),
        0 0 0 2px var(--accent-dim);
      background: var(--surface-hover);
    }

    .search-box i.search-icon {
      color: var(--text-dim);
      font-size: 16px;
      margin-right: 12px;
      transition: color 0.2s;
      cursor: pointer;
    }

    .search-box:focus-within i.search-icon {
      color: var(--accent);
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      caret-color: var(--accent);
      font-family: inherit;
      font-size: 15px;
      padding: 10px 0;
      -webkit-text-fill-color: var(--text);
    }

    .search-box input:-webkit-autofill,
    .search-box input:-webkit-autofill:hover,
    .search-box input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px var(--surface-hover) inset;
      -webkit-text-fill-color: var(--text);
      border: none;
      transition: background-color 5000s ease-in-out 0s;
    }

    .search-box input::placeholder {
      color: var(--text-dim);
    }

    .search-btn {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .search-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text, #fff);
    }

    .kbd-badge {
      font-size: 10px;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #d4d4d8;
    }

    
    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .chip i {
      font-size: 12px;
    }

    .chip:hover {
      background: var(--surface-hover);
      color: #fff;
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    
    .popular-section {
      margin-top: 36px;
      padding: 24px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      width: 100%;
    }

    .popular-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }

    .pop-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .pop-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 
        0 12px 26px -6px rgba(0, 0, 0, 0.7),
        0 0 16px -2px var(--accent-glow);
    }

    .pop-thumb-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pop-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .pop-card:hover .pop-thumb {
      transform: scale(1.08);
    }

    .pop-fallback-icon {
      font-size: 32px;
      color: var(--text-dim);
    }

    .pop-play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
      backdrop-filter: blur(2px);
    }

    .pop-card:hover .pop-play-overlay {
      opacity: 1;
    }

    .pop-play-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-text, #fff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transform: scale(0.85);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 14px var(--accent-glow);
      padding-left: 2px;
    }

    .pop-card:hover .pop-play-icon {
      transform: scale(1);
    }

    .pop-info {
      padding: 10px 10px 12px;
      text-align: center;
    }

    .pop-title {
      font-size: 13px;
      font-weight: 600;
      color: #f4f4f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .pop-card:hover .pop-title {
      color: #fff;
    }

    
    #searchOverlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      z-index: 9999;
    }

    #searchOverlay.show {
      display: block;
    }

    #overlayFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .home-quote {
      text-align: center;
      color: var(--text-dim, #9aa0a6);
      font-style: italic;
      margin-top: -16px;
      margin-bottom: 32px;
      font-size: 15px;
      min-height: 20px;
      z-index: 2;
    }

    @media (max-width: 600px) {
      .title {
        font-size: 2.2rem;
      }
      .popular-grid {
        grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
        gap: 10px;
      }
      .pop-info {
        padding: 8px 6px;
      }
      .pop-title {
        font-size: 11.5px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    
    <h1 class="title">Athyx Network</h1>
    <p class="home-quote" id="homeQuote"></p>

    
    <div class="search-container">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon" id="searchIcon"></i>
        <input type="text" id="searchInput" placeholder="Search with Google or enter a web URL..." autocomplete="off" spellcheck="false">
        <button class="search-btn" id="searchBtn" title="Press Enter to Search">
          <span>Search</span>
          <span class="kbd-badge">Enter</span>
        </button>
      </div>
    </div>

  </div>

  
  <div id="searchOverlay">
    <iframe id="overlayFrame" title="Web Search Viewer"></iframe>
  </div>

  <script>
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const searchIcon = document.getElementById("searchIcon");
    const searchOverlay = document.getElementById("searchOverlay");
    const overlayFrame = document.getElementById("overlayFrame");

    function performSearch(customQuery) {
      let query = customQuery || searchInput.value.trim();
      if (!query) return;

      if (!/^https?:\/\//i.test(query)) {
        if (/^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(\/.*)?$/i.test(query)) {
          query = "https://" + query;
        } else {
          query = "https://www.google.com/search?q=" + encodeURIComponent(query);
        }
      }

      const proxyPath = "/scramjet/index.html#";
      const proxyUrl = proxyPath + encodeURIComponent(query);
      overlayFrame.src = proxyUrl;
      searchOverlay.classList.add("show");
    }

    function closeOverlay() {
      searchOverlay.classList.remove("show");
      overlayFrame.src = "about:blank";
    }

    searchInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        performSearch();
        e.preventDefault();
      }
    });

    searchBtn.addEventListener("click", () => performSearch());
    searchIcon.addEventListener("click", () => performSearch());

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && searchOverlay.classList.contains("show")) {
        closeOverlay();
      }
    });


    fetch("https://cdn.jsdelivr.net/gh/daniil-athyx/Athyx-Network@main/quotes.txt?t=" + Date.now())
      .then(res => {
        if (!res.ok) throw new Error("Network error");
        return res.text();
      })
      .then(text => {
        const quotes = text.split(/\r?\n/).map(q => q.trim()).filter(q => q.length > 0);
        if (quotes.length > 0) {
          document.getElementById("homeQuote").textContent = `"${quotes[Math.floor(Math.random() * quotes.length)]}"`;
        }
      })
      .catch(() => {
        fetch("quotes.txt?t=" + Date.now())
          .then(res => res.text())
          .then(text => {
            const quotes = text.split(/\r?\n/).map(q => q.trim()).filter(q => q.length > 0);
            if (quotes.length > 0) {
              document.getElementById("homeQuote").textContent = `"${quotes[Math.floor(Math.random() * quotes.length)]}"`;
            }
          })
          .catch(e => console.log(e));
      });
  </script>

  <script src="../js/particle.js"></script>
</body>
</html>
