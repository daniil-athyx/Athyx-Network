<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Apps Hub &bull; Athyx Network</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../themes.css?v=4">
  <script src="../js/themes.js?v=4"></script>
  <script src="../js/image-cache.js?v=1"></script>
  <script src="../js/cdn-config.js?v=1"></script>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="shortcut icon" href="../assets/favicon.ico">

  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --bg-base: #000000;
      --surface: rgba(255, 255, 255, 0.05);
      --surface-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(255, 255, 255, 0.22);
      --text: #ffffff;
      --text-muted: #a1a1aa;
      --text-dim: rgb(10, 255, 206);
      --accent: rgb(10, 255, 206);
      --accent-dim: rgba(10, 255, 206, 0.18);
      --accent-glow: rgba(10, 255, 206, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
      background-color: #000000;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.25px, transparent 1.25px);
      background-size: 24px 24px;
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }


    #topBar {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow: none !important;
      border: none !important;
      border-bottom: none !important;
      padding: 16px 28px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 0 12px;
      height: 42px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-wrapper:hover {
      border-color: rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.7);
    }

    .search-wrapper:focus-within {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 6px 26px rgba(0, 0, 0, 0.8), 0 0 0 1px var(--accent-dim);
    }

    .search-wrapper i.search-icon {
      position: absolute;
      left: 14px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .search-wrapper:focus-within i.search-icon {
      color: var(--accent);
    }

    #searchBox {
      width: 100%;
      height: 100%;
      background: transparent !important;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      padding: 0 32px 0 32px;
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
      font-family: inherit;
      letter-spacing: -0.01em;
    }

    #searchBox:focus,
    #searchBox:focus-visible {
      outline: none !important;
      box-shadow: none !important;
      border: none !important;
    }

    #searchBox::placeholder {
      color: rgba(255, 255, 255, 0.42);
      font-weight: 400;
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.45);
      font-size: 13px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .clear-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
    }


    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 28px 120px;
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 18px;
    }

    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      user-select: none;
    }

    .app-card:hover {
      transform: translateY(-4px);
      background: var(--surface-hover);
      border-color: var(--border-hover);
      box-shadow: 0 16px 30px -10px rgba(0, 0, 0, 0.7);
    }

    .thumb-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #18181c;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .app-card:hover .app-thumb {
      transform: scale(1.08);
    }

    .thumb-fallback {
      font-size: 36px;
      color: var(--text-dim);
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .play-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      color: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transform: scale(0.85);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      padding-left: 2px;
    }

    .app-card:hover .play-overlay {
      opacity: 1;
    }

    .app-card:hover .play-icon {
      transform: scale(1);
    }

    .app-info {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .app-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #f4f4f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .app-card:hover .app-title {
      color: #fff;
    }


    .state-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 70px 20px;
      color: var(--text-dim);
      font-size: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .state-message i {
      font-size: 32px;
    }


    #appStage {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 99999;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    #appStage.show {
      display: flex;
    }

    #appStage::-webkit-scrollbar,
    #appStageIframe::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    body.app-active {
      overflow: hidden !important;
    }

    body.app-active::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }



    #appStageIframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      overflow: hidden;
    }

    #loadingModal {
      position: fixed;
      inset: 0;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 100000;
      color: #fff;
    }

    #loadingModal.show {
      display: flex;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      #topBar {
        padding: 12px 16px;
      }

      .main-content {
        padding: 20px 16px 120px;
      }

      .apps-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>


  <header id="topBar">
    <div class="search-wrapper">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchBox" placeholder="Search apps..." autocomplete="off" spellcheck="false">
      <button class="clear-btn" id="clearBtn" title="Clear search"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </header>


  <main class="main-content">
    <div class="apps-grid" id="appsGrid"></div>
  </main>


  <div id="appStage">
    <iframe id="appStageIframe"
      allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write; cross-origin-isolated"
      scrolling="no"></iframe>
  </div>


  <div id="loadingModal">
    <div class="loading-spinner"></div>
    <div id="loadingModalText">Initializing application...</div>
  </div>

  <script>
    function withNoCache(url) {
      if (!url || typeof url !== "string") return url;
      if (url.startsWith("data:") || url.startsWith("blob:") || url.startsWith("javascript:")) return url;
      if (url.includes("_nc=")) return url;
      const sep = url.includes("?") ? "&" : "?";
      return url + sep + "_nc=" + Date.now();
    }

    const APP_ICONS_BASE = "https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-apps@master/icons/";

    window.handleIconFallback = function (img) {
      if (!img.dataset.retried) {
        img.dataset.retried = "true";
        let url = new URL(img.src, window.location.href);
        let nextUrl = "";
        if (url.pathname.endsWith(".png")) {
          url.pathname = url.pathname.replace(/\.png$/i, ".jpg");
          nextUrl = url.href;
        } else if (url.pathname.endsWith(".jpg")) {
          url.pathname = url.pathname.replace(/\.jpg$/i, ".png");
          nextUrl = url.href;
        }
        if (nextUrl) {
          if (window.AthyxImageCache) {
            window.AthyxImageCache.applyToImage(img, nextUrl);
          } else {
            img.src = nextUrl;
          }
          return;
        }
      }
      img.style.display = "none";
      if (img.nextElementSibling) img.nextElementSibling.style.display = "block";
    };

    const APPS_JSON_URL = "https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-apps@master/apps.json";

    const fallbackApps = [
      { name: "TurboWarp", file: "turbowarp.html", icon: "turbowarp.png", tag: "Creative" },
      { name: "Silk Interactive", file: "silk.html", icon: "silk.png", tag: "Art & Math" },
      { name: "Pico-8 Education", file: "pico8edu.html", icon: "pico8edu.jpg", tag: "Console" },
      { name: "EmulatorJS", file: "emulatorjs.html", icon: "emulatorjs.png", tag: "Emulator" },
      { name: "Dos Wasm X", file: "doswasmx.html", icon: "doswasmx.png", tag: "Emulator" },
      { name: "TikTok", file: "tiktok.html", icon: "https://cdn.jsdelivr.net/gh/daniil-athyx/ubg-assets@main/app_icons/tiktok.png", tag: "Social" },
      { name: "Tubi", file: "tubi.html", icon: "https://cdn.jsdelivr.net/gh/daniil-athyx/ubg-assets@main/app_icons/tubi.png", tag: "Movies" },
      { name: "SoundCloud", file: "soundcloud.html", icon: "https://cdn.jsdelivr.net/gh/daniil-athyx/ubg-assets@main/app_icons/soundcloud.png", tag: "Music" },
      { name: "Twitch", file: "twitch.html", icon: "https://cdn.jsdelivr.net/gh/daniil-athyx/ubg-assets@main/app_icons/twitch.png", tag: "Social" }
    ];

    let allApps = [];

    let activeAppObj = null;

    const grid = document.getElementById("appsGrid");
    const countPill = document.getElementById("appCountPill");
    const searchBox = document.getElementById("searchBox");
    const clearBtn = document.getElementById("clearBtn");
    const appStage = document.getElementById("appStage");
    const appStageIframe = document.getElementById("appStageIframe");
    const loadingModal = document.getElementById("loadingModal");
    const loadingModalText = document.getElementById("loadingModalText");
    let loadingQuotes = ["Loading the matrix...", "Stealth mode engaged.", "Bypassing restrictions..."];

    fetch("https://cdn.jsdelivr.net/gh/daniil-athyx/Athyx-Network@main/quotes.txt?t=" + Date.now())
      .then(res => {
        if (!res.ok) throw new Error("Network error");
        return res.text();
      })
      .then(text => {
        const quotes = text.split(/\r?\n/).map(q => q.trim()).filter(q => q.length > 0);
        if (quotes.length > 0) loadingQuotes = quotes;
      })
      .catch(() => {
        fetch("quotes.txt?t=" + Date.now())
          .then(res => res.text())
          .then(text => {
            const quotes = text.split(/\r?\n/).map(q => q.trim()).filter(q => q.length > 0);
            if (quotes.length > 0) loadingQuotes = quotes;
          })
          .catch(e => console.log(e));
      });

    function renderApps() {
      const query = searchBox.value.trim().toLowerCase();
      const filtered = allApps.filter(app =>
        app.name.toLowerCase().includes(query) ||
        app.tag.toLowerCase().includes(query)
      );

      grid.innerHTML = "";
      if (countPill) countPill.textContent = `${filtered.length} Apps`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="state-message">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>No applications found matching "${query}".</span>
          </div>
        `;
        return;
      }

      filtered.forEach(app => {
        const card = document.createElement("div");
        card.className = "app-card";
        const rawIcon = app.icon ? (app.icon.startsWith("http") ? app.icon : APP_ICONS_BASE + app.icon.replace(/^app_icons\//, '').replace(/^icons\//, '')) : "";

        card.innerHTML = `
          <div class="thumb-wrapper">
            ${rawIcon ? `<img class="app-thumb" alt="${app.name}" loading="lazy" onerror="window.handleIconFallback(this);">` : ""}
            <i class="fa-solid fa-shapes thumb-fallback" style="${rawIcon ? 'display:none;' : ''}"></i>
          </div>
          <div class="app-info">
            <span class="game-title" title="${app.name}">${app.name}</span>
          </div>
        `;

        const imgEl = card.querySelector(".app-thumb");
        if (imgEl) {
          if (window.AthyxImageCache) {
            window.AthyxImageCache.applyToImage(imgEl, rawIcon);
          } else {
            imgEl.src = rawIcon;
          }
        }

        card.onclick = () => launchApp(app);
        grid.appendChild(card);
      });
    }

    async function launchApp(app) {
      activeAppObj = app;
      loadingModalText.textContent = `Launching ${app.name}...`;
      loadingModal.classList.add("show");

      try {
        const response = await fetch(withNoCache(`https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-apps@master/${app.file}`));
        if (!response.ok) throw new Error("Status " + response.status);
        let html = await response.text();

        // Rewrite any hardcoded firebaseapp links to the current origin
        html = html.replace(/https:\/\/athyx-network\.firebaseapp\.com/gi, window.location.origin);
        html = html.replace(/https:\/\/athyx-network\.web\.app/gi, window.location.origin);

        document.body.classList.add("app-active");

        const baseDir = app.file.includes("/") ? app.file.substring(0, app.file.lastIndexOf("/") + 1) : "";
        const baseTag = `<base href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-apps@master/${baseDir}">`;
        const noCacheMeta = `<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">`;
        const hideScrollCss = `<style>html, body { overflow: hidden !important; margin: 0; padding: 0; width: 100%; height: 100%; } *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }</style>`;
        const cleanHtml = html.includes("<head>")
          ? html.replace("<head>", "<head>" + baseTag + noCacheMeta + hideScrollCss)
          : "<head>" + baseTag + noCacheMeta + hideScrollCss + "</head>" + html;

        window.lastAppHtml = cleanHtml;

        const launchMode = localStorage.getItem("athyx_game_launch_mode") || "iframe";

        appStageIframe.removeAttribute("src");
        appStageIframe.srcdoc = cleanHtml;
        appStage.classList.add("show");

        try {
          window.parent.postMessage({ action: "athyx_game_active", active: true, title: app.name }, "*");
        } catch (e) { }
      } catch (err) {
        console.error("Failed to load app:", err);
        alert(`Failed to load ${app.name}.`);
      } finally {
        loadingModal.classList.remove("show");
      }
    }

    function reloadActiveApp() {
      if (activeAppObj) launchApp(activeAppObj);
    }

    function openAppInNewTab() {
      try {
        const title = localStorage.getItem("athyx_tab_title") || "Athyx Network";
        const icon = localStorage.getItem("athyx_tab_icon") || "https://ssl.gstatic.com/classroom/favicon.png";

        let content = "";
        if (appStageIframe.src && appStageIframe.src !== "about:blank" && !appStageIframe.src.startsWith("blob:")) {
          window.open(appStageIframe.src, "_blank");
          closeActiveApp();
          return;
        } else if (window.lastAppHtml) {
          content = window.lastAppHtml;
        } else {
          content = appStageIframe.srcdoc || "";
        }

        const win = window.open("about:blank", "_blank");
        if (win) {
          win.document.open();
          win.document.write(content);
          win.document.close();
          const link = win.document.createElement("link");
          link.rel = "icon";
          link.href = icon;
          win.document.head.appendChild(link);
          win.document.title = title;
          closeActiveApp();
        } else {
          alert("Popup blocked! Please allow popups for this site.");
        }
      } catch (e) {
        console.error("Failed to open app in new tab", e);
      }
    }

    function toggleStageFullscreen() {
      if (!document.fullscreenElement) {
        appStage.requestFullscreen().catch(err => console.error(err));
      } else {
        document.exitFullscreen();
      }
    }

    function closeActiveApp() {
      appStage.classList.remove("show");
      appStageIframe.srcdoc = "";
      activeAppObj = null;
      document.body.classList.remove("app-active");
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => { });
      }
      try {
        window.parent.postMessage({ action: "athyx_game_active", active: false }, "*");
      } catch (e) { }
    }

    function toggleStageFullscreen() {
      if (!document.fullscreenElement) {
        appStage.requestFullscreen().catch(err => console.error(err));
      } else {
        document.exitFullscreen();
      }
    }

    searchBox.addEventListener("input", () => {
      clearBtn.style.display = searchBox.value ? "block" : "none";
      renderApps();
    });

    clearBtn.addEventListener("click", () => {
      searchBox.value = "";
      clearBtn.style.display = "none";
      searchBox.focus();
      renderApps();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && appStage.classList.contains("show")) {
        closeActiveApp();
      }
    });

    async function initApps() {
      try {
        const res = await fetch(APPS_JSON_URL + "?t=" + Date.now());
        if (!res.ok) throw new Error("Could not load apps.json");
        allApps = await res.json();
      } catch (err) {
        console.warn("Using fallback app database:", err);
        allApps = fallbackApps;
      }

      // Inject TikTok if it hasn't been added to apps.json yet
      if (!allApps.some(app => app.name === "TikTok")) {
        allApps.push({ name: "TikTok", file: "tiktok.html", icon: "https://cdn.jsdelivr.net/gh/daniil-athyx/ubg-assets@main/app_icons/tiktok.png", tag: "Social" });
      }

      // Inject Tubi
      if (!allApps.some(app => app.name === "Tubi")) {
        allApps.push({ name: "Tubi", file: "tubi.html", icon: "https://cdn.jsdelivr.net/gh/daniil-athyx/ubg-assets@main/app_icons/tubi.png", tag: "Movies" });
      }

      // Inject SoundCloud
      if (!allApps.some(app => app.name === "SoundCloud")) {
        allApps.push({ name: "SoundCloud", file: "soundcloud.html", icon: "https://cdn.jsdelivr.net/gh/daniil-athyx/ubg-assets@main/app_icons/soundcloud.png", tag: "Music" });
      }

      // Inject Twitch
      if (!allApps.some(app => app.name === "Twitch")) {
        allApps.push({ name: "Twitch", file: "twitch.html", icon: "https://cdn.jsdelivr.net/gh/daniil-athyx/ubg-assets@main/app_icons/twitch.png", tag: "Social" });
      }

      allApps.sort((a, b) => a.name.localeCompare(b.name));
      if (countPill) countPill.textContent = `${allApps.length} Apps`;
      renderApps();
    }

    initApps();
  </script>

  <script src="../js/particle.js"></script>
</body>

</html>
