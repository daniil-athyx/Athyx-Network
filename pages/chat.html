<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../themes.css" />
  <script src="../js/themes.js?v=2"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: var(--bg, #0b0508);
      --surface: var(--surface, rgba(28, 12, 16, 0.82));
      --card: var(--surface-hover, rgba(42, 18, 24, 0.9));
      --border: var(--border, rgba(10, 255, 206, 0.16));
      --text: var(--text-main, #fff5f6);
      --muted: var(--text-muted, #f7c6ce);
      --accent: var(--accent, rgb(10, 255, 206));
      --accent-hover: var(--accent-hover, rgb(0, 214, 174));
      --danger: rgb(10, 255, 206);
      --success: #34d399;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      background-image: radial-gradient(rgba(255,255,255,0.06) 1.4px, transparent 1.4px);
      background-size: 22px 22px;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent-glow); outline-offset: 2px; }

    :root {
      color-scheme: dark;
      --bg: var(--bg, #0b0508);
      --surface: var(--surface, rgba(28, 12, 16, 0.82));
      --card: var(--surface-hover, rgba(42, 18, 24, 0.9));
      --border: var(--border, rgba(10, 255, 206, 0.16));
      --text: var(--text-main, #fff5f6);
      --muted: var(--text-muted, #f7c6ce);
      --accent: var(--accent, rgb(10, 255, 206));
      --accent-hover: var(--accent-hover, rgb(0, 214, 174));
      --danger: rgb(10, 255, 206);
      --success: #34d399;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      background-image: radial-gradient(rgba(255,255,255,0.06) 1.4px, transparent 1.4px);
      background-size: 22px 22px;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      overflow: hidden;
    }

    .app-shell {
      width: 100%;
      height: 100vh;
      margin: 0;
      padding-left: 88px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 0;
    }

    .header, .composer, .status-bar {
      background: var(--card);
      border: 0;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      box-shadow: none;
      backdrop-filter: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 42px; height: 42px; border-radius: 12px;
      background: var(--accent-dim); color: var(--accent); display: grid; place-items: center;
      border: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: clamp(1.15rem, 3vw, 1.5rem); font-family: 'Outfit', sans-serif; }
    .muted { color: var(--muted); font-size: 13px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .pill, button {
      border: 1px solid var(--border); border-radius: 10px; font: inherit;
      transition: 0.2s ease;
    }
    .pill { padding: 8px 10px; color: var(--muted); font-size: 12px; background: rgba(255,255,255,0.03); }
    .ghost-btn, .primary-btn, .danger-btn {
      cursor: pointer; color: var(--text); padding: 10px 14px; font-weight: 600;
    }
    .ghost-btn { background: rgba(255,255,255,0.03); }
    .primary-btn { background: var(--accent); color: var(--text-main); border-color: transparent; }
    .danger-btn { background: rgba(10, 255, 206, 0.12); color: #f7c6ce; border-color: rgba(10, 255, 206, 0.2); }
    button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.06); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .chat-panel {
      background: rgba(3, 7, 18, 0.5);
      border: 0;
      border-radius: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .status-bar {
      padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted);
    }
    .status { display: inline-flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .status-dot.online { background: var(--success); box-shadow: 0 0 8px rgba(52, 211, 153, 0.7); }

    #messages {
      flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: min(82%, 560px); padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.05); align-self: flex-start; word-break: break-word;
    }
    .message.self { align-self: flex-end; background: var(--accent-dim); border-color: var(--border); }
    .message-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 11px; color: var(--muted); }
    .message-name { color: var(--text); font-weight: 700; }
    .message-time { margin-left: auto; }
    .message-text { line-height: 1.45; white-space: pre-wrap; }
    .message-actions { margin-top: 8px; display: flex; justify-content: flex-end; }
    .message-actions button { padding: 5px 8px; font-size: 11px; background: transparent; color: var(--muted); }

    .composer { padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .composer input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 12px 14px; font: inherit; outline: none; }
    .composer input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    .composer button { min-width: 90px; }

    .auth-card, .error-box, .empty-state {
      display: grid; place-items: center; text-align: center; min-height: 200px; padding: 30px;
      border: 0; border-radius: 0; background: rgba(255,255,255,0.02);
    }
    .auth-card { gap: 10px; }
    .auth-card[hidden] { display: none !important; }
    .auth-card form { display: grid; gap: 10px; width: min(320px, 90%); }
    .auth-card input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--text); font: inherit; }
    .auth-card button { width: 100%; }
    .password-field { position: relative; }
    .password-field input { padding-right: 46px; }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: auto;
      min-width: 32px;
      padding: 6px 8px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .auth-tabs { display: flex; gap: 8px; }
    .auth-tabs button { flex: 1; background: transparent; color: var(--muted); }
    .auth-tabs button.active { background: var(--accent-dim); color: var(--text); border-color: var(--border); }
    .auth-message { font-size: 12px; color: var(--muted); min-height: 16px; }
    .error-box strong { display: block; margin-bottom: 8px; }

    .notice { font-size: 12px; color: var(--muted); }

    .admin-panel {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
    }
    .admin-panel.open { display: flex; }
    .admin-panel-card {
      width: min(680px, 100%);
      max-height: min(88dvh, 780px);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
    }
    .admin-panel-header,
    .admin-panel-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }
    .admin-panel-footer { border-bottom: 0; border-top: 1px solid var(--border); }
    .admin-panel-body { padding: 16px; overflow-y: auto; }
    .admin-user-list { display: grid; gap: 8px; }
    .admin-user-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
    }
    .admin-user-meta { min-width: 0; }
    .admin-user-name { color: var(--text); font-weight: 700; }
    .admin-user-rank { color: var(--muted); font-size: 12px; }
    .admin-user-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .admin-user-actions button,
    .admin-panel-footer button { min-height: 36px; }
    .admin-user-actions select {
      min-height: 36px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
    }
    .admin-panel-message { color: var(--muted); font-size: 12px; min-height: 16px; }

    @media (max-width: 700px) {
      .app-shell {
        height: 100dvh;
        min-height: 100dvh;
      }

      .header {
        padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
      }

      .brand-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
      }

      h1 {
        font-size: 1.1rem;
      }

      .header-actions {
        gap: 6px;
      }

      .header-actions .pill {
        padding: 7px 8px;
      }

      .header-actions .ghost-btn {
        padding: 8px 10px;
      }

      .auth-card,
      .error-box,
      .empty-state {
        min-height: 0;
        width: 100%;
        padding: 24px 16px;
      }

      .auth-card form {
        width: min(100%, 360px);
      }

      .auth-card input,
      .auth-card button {
        min-height: 46px;
      }

      #messages {
        padding: 12px;
        gap: 10px;
      }

      .message {
        max-width: 86%;
        border-radius: 12px;
      }

      .message-actions button {
        min-height: 32px;
        padding: 6px 10px;
      }

      .composer {
        position: sticky;
        bottom: 0;
        z-index: 5;
        grid-template-columns: 1fr auto;
        padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
        gap: 8px;
      }

      .composer input {
        min-height: 46px;
        padding: 11px 12px;
      }

      .composer button {
        min-height: 46px;
        min-width: 78px;
        padding: 10px 14px;
      }
    }

    @media (max-width: 420px) {
      .header-actions .pill {
        display: none;
      }

      .header-actions {
        margin-left: auto;
      }

      .message {
        max-width: 92%;
      }

      .composer {
        grid-template-columns: 1fr;
      }

      .composer button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="header" id="chat-header" hidden>
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-comments"></i></div>
        <h1>Community Chat</h1>
      </div>
      <div class="header-actions">
        <span class="pill" aria-live="polite"><i class="fa-solid fa-people-group"></i> <span id="member-count">0 online</span></span>
        <button class="ghost-btn" id="admin-btn" type="button" hidden><i class="fa-solid fa-shield-halved"></i> Admin</button>
      </div>
    </header>

    <section class="auth-card" id="auth-card">
      <div>
        <h2>Welcome to Community Chat</h2>
      </div>
      <div class="auth-tabs" aria-label="Authentication options">
        <button class="active" id="login-tab" type="button">Log in</button>
        <button id="register-tab" type="button">Register</button>
      </div>
      <form id="auth-form" novalidate>
        <input id="auth-username" type="text" minlength="3" maxlength="20" placeholder="Username" autocomplete="username" required />
        <div class="password-field">
          <input id="auth-password" type="password" minlength="6" placeholder="Password" autocomplete="current-password" required />
          <button class="password-toggle" id="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <button class="primary-btn" id="auth-submit" type="submit">Log in</button>
        <p class="auth-message" id="auth-message" aria-live="polite"></p>
      </form>
    </section>

    <section class="chat-panel" id="chat-panel" aria-live="polite" hidden>
      <div id="messages"></div>
    </section>

    <form class="composer" id="composer" novalidate hidden>
      <input id="message-input" maxlength="500" autocomplete="off" placeholder="Type a messageвЂ¦" aria-label="Message" />
      <button class="primary-btn" id="send-btn" type="submit">Send</button>
    </form>
  </main>

  <section class="admin-panel" id="admin-panel" aria-hidden="true">
    <div class="admin-panel-card">
      <div class="admin-panel-header">
        <div>
          <h2>Admin panel</h2>
          <p class="notice">Manage users and chat moderation</p>
        </div>
        <button class="ghost-btn" id="admin-close" type="button" aria-label="Close admin panel"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="admin-panel-body">
        <div class="admin-panel-message" id="admin-message" aria-live="polite"></div>
        <div class="admin-user-list" id="admin-user-list"></div>
      </div>
      <div class="admin-panel-footer">
        <span class="notice">Athyx admin actions</span>
        <button class="danger-btn" id="clear-chat-btn" type="button">Clear chat</button>
      </div>
    </div>
  </section>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { getFirestore, collection, query, where, onSnapshot, addDoc, deleteDoc, getDocs, serverTimestamp, doc, setDoc, getDoc, orderBy } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    import { firebaseConfig } from './chat-config.js';

    const messagesEl = document.getElementById('messages');
    const composer = document.getElementById('composer');
    const input = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const authCard = document.getElementById('auth-card');
    const authForm = document.getElementById('auth-form');
    const authUsername = document.getElementById('auth-username');
    const authPassword = document.getElementById('auth-password');
    const passwordToggle = document.getElementById('password-toggle');
    const authSubmit = document.getElementById('auth-submit');
    const authMessage = document.getElementById('auth-message');
    const loginTab = document.getElementById('login-tab');
    const registerTab = document.getElementById('register-tab');
    const adminBtn = document.getElementById('admin-btn');
    const adminPanel = document.getElementById('admin-panel');
    const adminUserList = document.getElementById('admin-user-list');
    const adminMessage = document.getElementById('admin-message');
    const clearChatBtn = document.getElementById('clear-chat-btn');
    const adminCloseBtn = document.getElementById('admin-close');
    const chatHeader = document.getElementById('chat-header');
    const chatPanel = document.getElementById('chat-panel');
    const memberCount = document.getElementById('member-count');
    let unsubscribeMessages = null;
    let unsubscribePresence = null;
    let presenceInterval = null;
    let user = null;
    let userName = '';
    let lastMessageId = null;
    let authMode = 'login';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const messagesRef = collection(db, 'messages');
    const usersRef = collection(db, 'users');
    const usernamesRef = collection(db, 'usernames');
    const adminUsername = 'athyx';

    function isAdminUser(currentUser) {
      return !!currentUser && currentUser.email?.toLowerCase() === `${adminUsername}@athyx-network.local`;
    }

    function formatOnlineCount(count) {
      return `${count} ${count === 1 ? 'person online' : 'people online'}`;
    }

    function isRecentlyActive(profile) {
      const lastSeen = profile.lastSeen?.toDate ? profile.lastSeen.toDate() : null;
      return !!lastSeen && Date.now() - lastSeen.getTime() <= 180000;
    }

    function setPresence(online) {
      if (!user) return;
      const profileRef = doc(usersRef, user.uid);
      setDoc(profileRef, {
        online,
        lastSeen: serverTimestamp()
      }, { merge: true });
    }

    function subscribeToPresence() {
      if (unsubscribePresence) unsubscribePresence();
      const onlineUsersQuery = query(usersRef, where('online', '==', true));
      unsubscribePresence = onSnapshot(onlineUsersQuery, (snapshot) => {
        const profiles = snapshot.docs
          .map(document => ({ uid: document.id, ...document.data() }))
          .filter(isRecentlyActive);
        memberCount.textContent = formatOnlineCount(profiles.length);
        renderAdminUsers(profiles);
      }, (error) => {
        console.error('Presence error:', error);
        memberCount.textContent = 'Presence unavailable';
      });
    }

    function updatePresenceHeartbeat() {
      if (!user) return;
      setPresence(true);
    }

    function escapeHtml(value = '') {
      return value.replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
    }

    function formatTime(timestamp) {
      if (!timestamp) return 'just now';
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      return new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' }).format(date);
    }

    function renderMessage(message) {
      const item = document.createElement('article');
      item.className = 'message' + (message.userId === user?.uid ? ' self' : '');
      item.dataset.id = message.id;
      item.innerHTML = `
        <div class="message-meta">
          <span class="message-name">${escapeHtml(message.nickname || 'User')}</span>
          <span class="message-time">${escapeHtml(formatTime(message.createdAt))}</span>
        </div>
        <div class="message-text">${escapeHtml(message.text)}</div>
      `;
      return item;
    }

    function showEmptyState() {
      messagesEl.innerHTML = `
        <div class="empty-state">
          <div>
            <h2>No messages yet</h2>
            <p class="notice">Be the first person to start the conversation.</p>
          </div>
        </div>`;
    }

    function showError(message) {
      messagesEl.innerHTML = `
        <div class="error-box">
          <div>
            <strong>Chat unavailable</strong>
            <span class="notice">${escapeHtml(message)}</span>
          </div>
        </div>`;
    }

    function showAdminMessage(message, isError = false) {
      adminMessage.textContent = message;
      adminMessage.style.color = isError ? 'var(--danger)' : 'var(--muted)';
    }

    async function clearChatMessages() {
      if (!isAdminUser(user)) return;
      const messageDocs = await getDocs(messagesRef);
      await Promise.all(messageDocs.docs.map(document => deleteDoc(doc(messagesRef, document.id))));
      showAdminMessage(`Cleared ${messageDocs.size} message${messageDocs.size === 1 ? '' : 's'}.`);
    }

    async function setUserRank(targetUserId, rank) {
      if (!isAdminUser(user)) return;
      if (targetUserId === user.uid) return;
      await setDoc(doc(usersRef, targetUserId), { rank }, { merge: true });
      showAdminMessage(`Updated rank to ${escapeHtml(rank)}.`);
    }

    async function setUserBan(targetUserId, banned) {
      if (!isAdminUser(user)) return;
      if (targetUserId === user.uid) return;
      await setDoc(doc(usersRef, targetUserId), { banned }, { merge: true });
      showAdminMessage(`${banned ? 'Banned' : 'Unbanned'} user.`);
    }

    function renderAdminUsers(users) {
      adminUserList.innerHTML = '';
      if (!users.length) {
        adminUserList.innerHTML = '<p class="notice">No users are currently online.</p>';
        return;
      }

      const isAdmin = isAdminUser(user);
      users.forEach(profile => {
        const item = document.createElement('div');
        const rank = profile.rank || 'member';
        item.className = 'admin-user-item';
        item.innerHTML = `
          <div class="admin-user-meta">
            <div class="admin-user-name">${escapeHtml(profile.nickname || 'User')}</div>
            <div class="admin-user-rank">${escapeHtml(rank === 'member' ? 'Member' : rank)}</div>
          </div>
          <div class="admin-user-actions">${isAdmin ? `
            <select data-rank-select aria-label="Choose rank">
              <option value="member" ${rank === 'member' ? 'selected' : ''}>Member</option>
              <option value="moderator" ${rank === 'moderator' ? 'selected' : ''}>Moderator</option>
              <option value="admin" ${rank === 'admin' ? 'selected' : ''}>Admin</option>
            </select>
            <button class="danger-btn" data-ban-btn type="button">${profile.banned ? 'Unban' : 'Ban'}</button>
          ` : ''}</div>
        `;
        if (isAdmin) {
          item.querySelector('[data-rank-select]').addEventListener('change', (event) => {
            setUserRank(profile.uid, event.target.value);
          });
          item.querySelector('[data-ban-btn]').addEventListener('click', () => {
            setUserBan(profile.uid, !profile.banned);
          });
        }
        adminUserList.appendChild(item);
      });
    }

    function subscribeToMessages() {
      if (unsubscribeMessages) unsubscribeMessages();
      const q = query(messagesRef, orderBy('createdAt', 'asc'));
      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        const messages = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        messagesEl.innerHTML = '';

        if (!messages.length) {
          showEmptyState();
          return;
        }

        messages.forEach(message => messagesEl.appendChild(renderMessage(message)));
        const last = messages[messages.length - 1];
        if (last && last.id !== lastMessageId) {
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        lastMessageId = last?.id || lastMessageId;
      }, (error) => {
        console.error('Messages error:', error);
        showError('Unable to load messages. Check your connection and try again.');
      });
    }

    function normalizeUsername(value) {
      return value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
    }

    function usernameEmail(username) {
      return `${username}@athyx-network.local`;
    }

    function setAuthMode(mode) {
      authMode = mode;
      const registration = mode === 'register';
      loginTab.classList.toggle('active', !registration);
      registerTab.classList.toggle('active', registration);
      authSubmit.textContent = registration ? 'Create account' : 'Log in';
      authMessage.textContent = '';
      authUsername.focus();
    }

    async function setUserProfile() {
      if (!user) return;
      const profileRef = doc(usersRef, user.uid);
      const profile = await getDoc(profileRef);
      const savedName = localStorage.getItem('athyx_chat_name') || '';
      const requestedName = profile?.data()?.nickname || savedName || user.displayName || 'User';
      userName = requestedName.substring(0, 20);
      await setDoc(profileRef, {
        nickname: userName,
        updatedAt: serverTimestamp()
      }, { merge: true });
      localStorage.setItem('athyx_chat_name', userName);
    }

    async function handleAuth(event) {
      event.preventDefault();
      authSubmit.disabled = true;
      authMessage.textContent = '';

      try {
        const username = normalizeUsername(authUsername.value);
        const password = authPassword.value;
        if (!username || username.length < 3 || username.length > 20) {
          throw new Error('Enter a username from 3 to 20 characters.');
        }
        if (!password || password.length < 6) {
          throw new Error('Password must be at least 6 characters.');
        }

        if (authMode === 'register') {
          const usernameRef = doc(usernamesRef, username);
          const existingUsername = await getDoc(usernameRef);
          if (existingUsername.exists()) {
            throw new Error('That username is already taken.');
          }

          const email = usernameEmail(username);
          const result = await createUserWithEmailAndPassword(auth, email, password);
          user = result.user;
          userName = username;
          await setDoc(doc(usersRef, user.uid), {
            nickname: username,
            username,
            role: 'member',
            banned: false,
            updatedAt: serverTimestamp()
          }, { merge: true });
          await setDoc(usernameRef, {
            uid: user.uid,
            email,
            createdAt: serverTimestamp()
          });
        } else {
          const usernameRef = doc(usernamesRef, username);
          const usernameRecord = await getDoc(usernameRef);
          if (!usernameRecord.exists()) {
            throw new Error('Username not found.');
          }

          const email = usernameRecord.data().email;
          const result = await signInWithEmailAndPassword(auth, email, password);
          user = result.user;
          userName = usernameRecord.data().uid === user.uid ? username : username;
        }

        if (authMode === 'register') {
          await setDoc(doc(usersRef, user.uid), {
            role: userName.toLowerCase() === adminUsername ? 'admin' : 'member',
            banned: false
          }, { merge: true });
        }

        await setUserProfile();
      } catch (error) {
        console.error('Authentication failed:', error);
        authMessage.textContent = error.message || 'Unable to complete authentication.';
        authSubmit.disabled = false;
        return;
      }
    }

    async function reportMessage(message) {
      if (!user) return;
      const reportRef = doc(db, 'messageReports', `${message.id}_${user.uid}`);
      const report = await getDoc(reportRef);
      if (report.exists()) {
        alert('You already reported this message.');
        return;
      }

      await setDoc(reportRef, {
        messageId: message.id,
        reporterId: user.uid,
        createdAt: serverTimestamp(),
        reason: 'User report'
      });
      alert('Message reported. Moderators will review it.');
    }

    async function sendMessage(text) {
      if (!user || !text.trim()) return;
      const cleanText = text.trim().substring(0, 500);
      const nickname = userName.trim().substring(0, 20) || 'User';

      try {
        sendBtn.disabled = true;
        await addDoc(messagesRef, {
          text: cleanText,
          nickname,
          userId: user.uid,
          createdAt: serverTimestamp()
        });
        input.value = '';
        input.focus();
      } catch (error) {
        console.error('Send failed:', error);
        alert('Your message could not be sent. Please try again.');
      } finally {
        sendBtn.disabled = false;
      }
    }

    composer.addEventListener('submit', (event) => {
      event.preventDefault();
      sendMessage(input.value);
    });

    loginTab.addEventListener('click', () => setAuthMode('login'));
    registerTab.addEventListener('click', () => setAuthMode('register'));
    authForm.addEventListener('submit', handleAuth);
    passwordToggle.addEventListener('click', () => {
      const showing = authPassword.type === 'text';
      authPassword.type = showing ? 'password' : 'text';
      passwordToggle.textContent = showing ? 'Show' : 'Hide';
      passwordToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      passwordToggle.setAttribute('aria-pressed', String(!showing));
      authPassword.focus();
      authPassword.setSelectionRange(authPassword.value.length, authPassword.value.length);
    });

    adminBtn.addEventListener('click', () => {
      adminPanel.classList.add('open');
      adminPanel.setAttribute('aria-hidden', 'false');
    });
    adminCloseBtn.addEventListener('click', () => {
      adminPanel.classList.remove('open');
      adminPanel.setAttribute('aria-hidden', 'true');
    });
    clearChatBtn.addEventListener('click', () => clearChatMessages());

    onAuthStateChanged(auth, (currentUser) => {
      user = currentUser;
      authSubmit.disabled = false;
      authCard.hidden = !!currentUser;
      authCard.style.display = currentUser ? 'none' : 'grid';
      authForm.hidden = !!currentUser;
      composer.hidden = !currentUser;
      chatPanel.hidden = !currentUser;
      chatHeader.hidden = !currentUser;
      adminBtn.hidden = !isAdminUser(currentUser);

      if (!currentUser) {
        memberCount.textContent = '0 people online';
        if (presenceInterval) clearInterval(presenceInterval);
        if (unsubscribePresence) unsubscribePresence();
        setPresence(false);
        return;
      }

      setUserProfile().then(() => {
        subscribeToMessages();
        subscribeToPresence();
        updatePresenceHeartbeat();
        if (presenceInterval) clearInterval(presenceInterval);
        presenceInterval = setInterval(updatePresenceHeartbeat, 30000);
      }).catch(error => {
        console.error('Profile setup failed:', error);
        showError(`Unable to load your profile. ${error.message || 'Check the console for details.'}`);
      });
    });

    memberCount.textContent = '0 people online';
    setAuthMode('login');
  </script>
</body>
</html>
