<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Could Not Be Loaded</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; background: #0b0f17; color: #e2e8f0; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at top, rgba(14,165,233,0.12), transparent 38%); }
    .card { width: min(560px, 90vw); padding: 32px; border: 1px solid rgba(148,163,184,0.2); border-radius: 18px; background: rgba(15,23,42,0.82); box-shadow: 0 20px 48px rgba(0,0,0,0.35); }
    h1 { margin: 0 0 10px; font-size: clamp(26px, 5vw, 36px); }
    p { color: #94a3b8; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    button { border: 0; border-radius: 10px; padding: 11px 16px; font: inherit; font-weight: 700; cursor: pointer; }
    .primary { background: #0ea5e9; color: #06131c; }
    .secondary { background: rgba(255,255,255,0.08); color: #e2e8f0; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Page could not be loaded</h1>
    <p id="reason">The page could not be opened through the proxy.</p>
    <div class="actions">
      <button class="primary" id="retry">Retry proxy</button>
      <button class="secondary" id="direct">Open directly</button>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const originalUrl = params.get('url');
    const reason = params.get('reason') || 'The page could not be opened through the proxy.';
    document.getElementById('reason').textContent = reason;

    document.getElementById('retry').addEventListener('click', () => {
      const parentWindow = window.parent;
      if (parentWindow && parentWindow.retryCompatibilityErrorPage) {
        parentWindow.retryCompatibilityErrorPage();
      } else {
        window.location.reload();
      }
    });

    document.getElementById('direct').addEventListener('click', () => {
      if (originalUrl) {
        window.top.location.href = decodeURIComponent(originalUrl);
      }
    });
  </script>
</body>
</html>
