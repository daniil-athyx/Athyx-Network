<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy/Cloud Games - Athyx Network</title>
  <link rel="stylesheet" href="../themes.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      color: var(--text-main, #fff5f6);
      font-family: 'Outfit', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .empty-state {
      text-align: center;
      padding: 32px;
      background: var(--surface, rgba(20, 20, 28, 0.75));
      border: 1px solid var(--border, rgba(255, 255, 255, 0.1));
      border-radius: 18px;
      backdrop-filter: blur(12px);
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0; opacity: 0.75; font-size: 14px; }
  </style>
  <script src="../js/themes.js"></script>
</head>
<body>
  <div class="empty-state">
    <h1>Proxy / Cloud Games</h1>
    <p>Cloud &amp; proxied games will appear here.</p>
  </div>
</body>
</html>
