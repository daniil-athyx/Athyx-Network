<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>New Tab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../themes.css">
  <script src="../js/themes.js?v=2"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0508;
      --surface: rgba(28, 12, 16, 0.82);
      --surface-hover: rgba(42, 18, 24, 0.9);
      --surface-active: rgba(64, 26, 35, 0.96);
      --border: rgba(10, 255, 206, 0.16);
      --border-hover: rgba(10, 255, 206, 0.32);
      --text: #fff1f2;
      --text-muted: #fecdd3;
      --text-dim: rgb(10, 255, 206);
      --accent: rgb(10, 255, 206);
      --accent-dim: rgba(10, 255, 206, 0.18);
      --accent-glow: rgba(10, 255, 206, 0.45);
      --accent-hover: rgb(0, 214, 174);
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(rgba(255, 255, 255, 0.075) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
      transition: background-color 0.25s ease, color 0.2s ease;
    }

    h1.clock {
      font-family: 'Outfit', sans-serif;
      font-size: 3.5rem;
      margin-bottom: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      animation: fadeIn 1s ease-in-out;
      background: linear-gradient(180deg, #ffffff 30%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px var(--accent-glow);
    }

    .search-container {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.02);
      animation: popIn 0.6s ease;
      width: 580px;
      max-width: 90%;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-container:focus-within {
      background: var(--surface-hover);
      border-color: var(--accent);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px var(--accent-dim);
    }

    .search-container input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1rem;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      padding: 5px;
    }

    .search-container select {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      border-radius: 8px;
      padding: 6px 12px;
      margin-left: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .search-container select:hover {
      background: var(--surface-active);
      border-color: var(--accent);
    }

    .icons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(64px, 1fr));
      gap: 20px;
      margin-top: 32px;
      max-width: 440px;
    }

    .shortcut-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-muted);
      width: 80px;
    }

    .icon {
      width: 64px;
      height: 64px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      margin-bottom: 8px;
    }

    .shortcut-item:hover .icon {
      transform: translateY(-4px) scale(1.06);
      background: var(--surface-hover);
      border-color: var(--accent);
      box-shadow: 0 8px 24px var(--accent-glow);
      cursor: pointer;
    }

    .shortcut-label {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      margin-top: 2px;
      transition: color 0.2s;
    }

    .shortcut-item:hover .shortcut-label {
      color: var(--text);
    }

    .icon img {
      width: 26px;
      height: 26px;
      filter: brightness(0) invert(1);
    }

    .extras {
      margin-top: 28px;
      font-size: 0.92rem;
      color: var(--text-dim);
      max-width: 500px;
    }

    .footer {
      position: absolute;
      bottom: 15px;
      font-size: 0.85rem;
      color: var(--text-muted);
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .footer span.heart {
      color: var(--accent);
      font-size: 1.1rem;
    }

    .footer:hover {
      opacity: 1;
      color: var(--text);
      text-shadow: 0 0 10px var(--accent-glow);
      cursor: pointer;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popIn {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Loading Spinner */
    .loading-spinner-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .loading-spinner-overlay.show {
      display: flex;
    }

    .loading-spinner {
      width: 54px;
      height: 54px;
      border: 4px solid var(--surface-hover);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      box-shadow: 0 0 16px var(--accent-dim);
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <!-- Loading Spinner -->
  <div class="loading-spinner-overlay" id="loadingSpinner">
    <div class="loading-spinner"></div>
  </div>

  <h1 class="clock">00:00:00</h1>

  <form id="searchForm" class="search-container">
    <input type="text" id="searchInput" placeholder="Search the web..." autocomplete="off">

    <!-- THE CHANGE IS HERE: The "selected" attribute was moved -->
    <select id="engineSelect">
      <option value="https://search.brave.com/search?q=" selected>Brave Search</option>
      <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
      <option value="https://www.google.com/search?safe=active&q=">Google</option>
      <option value="https://www.bing.com/search?q=">Bing</option>
    </select>
  </form>

  <div class="icons">
    <div class="shortcut-item">
      <a href="https://youtube.com" class="icon"><img
          src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg" alt="YouTube"></a>
      <span class="shortcut-label">YouTube</span>
    </div>
    <div class="shortcut-item">
      <a href="https://github.com" class="icon"><img
          src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" alt="GitHub"></a>
      <span class="shortcut-label">GitHub</span>
    </div>
    <div class="shortcut-item">
      <a href="https://mail.google.com" class="icon"><img
          src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/gmail.svg" alt="Gmail"></a>
      <span class="shortcut-label">Gmail</span>
    </div>
    <div class="shortcut-item">
      <a href="https://twitter.com" class="icon"><img
          src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg" alt="Twitter/X"></a>
      <span class="shortcut-label">Twitter</span>
    </div>
    <div class="shortcut-item">
      <a href="https://nextjs.org" class="icon"><img
          src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/nextdotjs.svg" alt="Next.js"></a>
      <span class="shortcut-label">Next.js</span>
    </div>

  </div>



  <script>
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString();
      document.querySelector('.clock').textContent = time;
    }
    setInterval(updateClock, 1000);
    updateClock();

    document.getElementById("searchForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const query = document.getElementById("searchInput").value.trim();
      const engine = document.getElementById("engineSelect").value;
      const urlToOpen = engine + encodeURIComponent(query);

      if (query && window.parent) {
        // Show loading spinner
        const loadingSpinner = document.getElementById('loadingSpinner');
        if (loadingSpinner) {
          loadingSpinner.classList.add('show');
          loadingSpinner.offsetHeight; // Force reflow
        }

        requestAnimationFrame(() => {
          window.parent.postMessage({ type: 'navigate', url: urlToOpen }, '*');
        });
      }
    });



    document.querySelectorAll('.shortcut-item > a.icon').forEach(link => {
      // The 'add-new' icon doesn't have an 'a' tag, so this check is implicitly handled
      // by the selector '.shortcut-item > a.icon'
      link.addEventListener('click', function (event) {
        event.preventDefault();
        const urlToOpen = this.href;
        if (window.parent) {
          // Show loading spinner
          const loadingSpinner = document.getElementById('loadingSpinner');
          if (loadingSpinner) {
            loadingSpinner.classList.add('show');
            loadingSpinner.offsetHeight; // Force reflow
          }

          requestAnimationFrame(() => {
            window.parent.postMessage({ type: 'navigate', url: urlToOpen }, '*');
          });
        }
      });
    });

    // Load custom shortcuts
    function loadShortcuts() {
      const shortcuts = JSON.parse(localStorage.getItem('shortcuts') || '[]');
      const container = document.querySelector('.icons');
      const addButton = document.getElementById('addNewShortcut');

      // Remove existing custom shortcuts to avoid duplicates if re-running
      document.querySelectorAll('.shortcut-item.custom-shortcut').forEach(el => el.remove());

      const icons = ['fa-link', 'fa-bookmark', 'fa-star'];

      shortcuts.forEach(shortcut => {
        const randomIcon = icons[Math.floor(Math.random() * icons.length)];

        const div = document.createElement('div');
        div.className = 'shortcut-item custom-shortcut';

        div.innerHTML = `
          <a href="${shortcut.url}" class="icon">
            <i class="fa-solid ${randomIcon}" style="font-size: 28px; color: #fff;"></i>
          </a>
          <span class="shortcut-label">${shortcut.name}</span>
        `;

        const a = div.querySelector('a');
        a.addEventListener('click', function (event) {
          event.preventDefault();
          const urlToOpen = this.href;
          if (window.parent) {
            // Show loading spinner
            const loadingSpinner = document.getElementById('loadingSpinner');
            if (loadingSpinner) {
              loadingSpinner.classList.add('show');
              loadingSpinner.offsetHeight; // Force reflow
            }

            requestAnimationFrame(() => {
              window.parent.postMessage({ type: 'navigate', url: urlToOpen }, '*');
            });
          }
        });

        // Insert before the "Add New" button container if it exists
        if (addButton && addButton.parentNode) {
          container.insertBefore(div, addButton.parentNode);
        } else {
          container.appendChild(div);
        }
      });
    }

    const addBtn = document.getElementById('addNewShortcut');
    if (addBtn) {
      addBtn.addEventListener('click', () => {
        // Use browser window notifications/prompts as requested
      // Since we are in an iframe, we might need to use standard prompt
      const name = prompt("Enter shortcut name:");
      if (!name) return;

      let url = prompt("Enter shortcut URL:");
      if (!url) return;

      if (!url.startsWith('http')) {
        url = 'https://' + url;
      }

      const shortcuts = JSON.parse(localStorage.getItem('shortcuts') || '[]');
      shortcuts.push({ name, url });
      localStorage.setItem('shortcuts', JSON.stringify(shortcuts));

      loadShortcuts();
      });
    }

    loadShortcuts();
  </script>
</body>

</html>
